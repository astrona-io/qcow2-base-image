name: Build all golden images

# Manual trigger only, same reasoning as build-image.yml: a full image build
# takes 5-10+ minutes per distro/layer/arch and consumes Actions minutes.
#
# Dynamic by design: `discover` lists distros/* off the filesystem, so
# adding a new distro directory picks it up automatically -- no workflow
# edits needed. Each distro then gets its own independent call into
# build-distro.yml (a reusable workflow), which builds that one distro's
# base (both arches) and then its layers -- see build-distro.yml's header
# comment for why this is a separate reusable workflow rather than one flat
# job: it's what lets e.g. ubuntu's layers start as soon as ubuntu's base
# finishes, without waiting on fedora or opensuse's base too.
on:
  workflow_dispatch:
    inputs:
      push:
        description: "Push built artifacts to the registry"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      distros: ${{ steps.list.outputs.distros }}
    steps:
      - uses: actions/checkout@v5

      - name: List distros
        id: list
        run: |
          set -euo pipefail
          DISTROS_JSON=$(ls distros | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "distros=$DISTROS_JSON" >> "$GITHUB_OUTPUT"
          echo "distros: $DISTROS_JSON"

  build:
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        distro: ${{ fromJson(needs.discover.outputs.distros) }}
    uses: ./.github/workflows/build-distro.yml
    with:
      distro: ${{ matrix.distro }}
      push: ${{ inputs.push }}
    secrets: inherit
