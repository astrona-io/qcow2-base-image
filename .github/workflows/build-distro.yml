name: Build one distro (base + its layers)

# Reusable workflow, called once per distro (see build-all.yml's `build`
# job) instead of being one flat workflow with a single build-base job and
# a single build-layer job. That flat shape has a real limitation: GitHub
# Actions' `needs:` waits for an ENTIRE matrixed job (every leg) before a
# dependent job starts, not just the matching leg -- so a layer job would
# wait for every distro's base to finish, not just its own distro's base.
# Calling this reusable workflow once per distro (as its own matrix of
# workflow_call jobs) gives each distro a fully independent base -> layers
# chain: e.g. ubuntu's layers start the moment ubuntu's base finishes,
# without waiting on fedora or opensuse at all.
#
# Inputs reach `run:` scripts through env: rather than inline ${{ }}, so
# they can't inject shell.
on:
  workflow_call:
    inputs:
      distro:
        required: true
        type: string
      arch:
        description: "all, amd64 or arm64"
        required: false
        type: string
        default: all
      push:
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      base_matrix: ${{ steps.matrix.outputs.base_matrix }}
      layer_matrix: ${{ steps.matrix.outputs.layer_matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Build this distro's base + layer matrices
        id: matrix
        env:
          DISTRO: ${{ inputs.distro }}
          ARCH: ${{ inputs.arch }}
        run: |
          set -euo pipefail
          case "$ARCH" in
            all|amd64|arm64) ;;
            *) echo "::error::invalid arch '$ARCH' (want all, amd64 or arm64)"; exit 1 ;;
          esac

          BASE_MATRIX=$(jq -nc --arg want "$ARCH" '
            {include: [
              {arch: "amd64", runner: "ubuntu-latest"},
              {arch: "arm64", runner: "ubuntu-24.04-arm"}
            ] | map(select($want == "all" or .arch == $want))}')

          LAYERS_JSON=$( (ls "distros/$DISTRO/layers" 2>/dev/null || true) \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          LAYER_MATRIX=$(jq -nc --argjson layers "$LAYERS_JSON" --argjson base "$BASE_MATRIX" '
            {include: [ $layers[] as $layer | $base.include[] | . + {layer: $layer} ]}')

          echo "base_matrix=$BASE_MATRIX" >> "$GITHUB_OUTPUT"
          echo "layer_matrix=$LAYER_MATRIX" >> "$GITHUB_OUTPUT"
          echo "base matrix for $DISTRO: $BASE_MATRIX"
          echo "layer matrix for $DISTRO: $LAYER_MATRIX"

  base:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.base_matrix) }}
    runs-on: ${{ matrix.runner }}
    # Hosted runners hard-stop at 360m; stay under it so a hung VM fails
    # with astroimg's own timeout error instead of a silent runner kill.
    timeout-minutes: 350
    env:
      DISTRO: ${{ inputs.distro }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up build host
        id: setup
        uses: ./.github/actions/setup-build
        with:
          arch: ${{ matrix.arch }}

      - name: Run pipeline (headless)
        env:
          CLOUD_INIT_TIMEOUT: ${{ steps.setup.outputs.cloud_init_timeout }}
        run: |
          ./bin/astroimg pipeline \
            --headless \
            --distro "$DISTRO" \
            --arch "$ARCH" \
            --cloud-init-timeout "$CLOUD_INIT_TIMEOUT"

      - name: Upload base artifact (consumed by this distro's layer builds, and downloadable)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.distro }}-base-${{ matrix.arch }}
          path: build/*.qcow2
          retention-days: 7

      - name: Log in to registry
        if: ${{ inputs.push }}
        # GITHUB_TOKEN can only push to a GHCR package this repo has been
        # granted Write on (package settings -> Manage Actions access). A
        # package first created by a local push has no such grant, so the
        # push fails with "denied". Set a GHCR_TOKEN secret (PAT with
        # write:packages, plus a GHCR_USERNAME variable for its owner) to
        # push with that instead; otherwise fall back to GITHUB_TOKEN.
        env:
          REGISTRY_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ vars.GHCR_USERNAME || github.actor }}
        run: echo "$REGISTRY_TOKEN" | oras login ghcr.io -u "$REGISTRY_USER" --password-stdin

      - name: Push artifact
        if: ${{ inputs.push }}
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          ./bin/astroimg push \
            --distro "$DISTRO" \
            --arch "$ARCH" \
            --registry ghcr.io \
            --username "$OWNER"

  layers:
    needs: [plan, base]
    if: ${{ fromJson(needs.plan.outputs.layer_matrix).include[0] != null }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.layer_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    env:
      DISTRO: ${{ inputs.distro }}
      LAYER: ${{ matrix.layer }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up build host
        id: setup
        uses: ./.github/actions/setup-build
        with:
          arch: ${{ matrix.arch }}

      - name: Download this distro/arch's base artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.distro }}-base-${{ matrix.arch }}
          path: build

      - name: Run pipeline (headless)
        env:
          CLOUD_INIT_TIMEOUT: ${{ steps.setup.outputs.cloud_init_timeout }}
        run: |
          ./bin/astroimg pipeline \
            --headless \
            --distro "$DISTRO" \
            --layer "$LAYER" \
            --arch "$ARCH" \
            --cloud-init-timeout "$CLOUD_INIT_TIMEOUT"

      - name: Upload layer artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.distro }}-${{ matrix.layer }}-${{ matrix.arch }}
          path: build/*${{ matrix.layer }}*.qcow2
          retention-days: 7

      - name: Log in to registry
        if: ${{ inputs.push }}
        # GITHUB_TOKEN can only push to a GHCR package this repo has been
        # granted Write on (package settings -> Manage Actions access). A
        # package first created by a local push has no such grant, so the
        # push fails with "denied". Set a GHCR_TOKEN secret (PAT with
        # write:packages, plus a GHCR_USERNAME variable for its owner) to
        # push with that instead; otherwise fall back to GITHUB_TOKEN.
        env:
          REGISTRY_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ vars.GHCR_USERNAME || github.actor }}
        run: echo "$REGISTRY_TOKEN" | oras login ghcr.io -u "$REGISTRY_USER" --password-stdin

      - name: Push artifact
        if: ${{ inputs.push }}
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          ./bin/astroimg push \
            --distro "$DISTRO" \
            --layer "$LAYER" \
            --arch "$ARCH" \
            --registry ghcr.io \
            --username "$OWNER"
