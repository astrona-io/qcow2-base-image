name: Build golden image

# Manual trigger only: a full desktop-package install inside the guest takes
# 5-10+ minutes and consumes Actions minutes, so this deliberately doesn't
# run on every push. Wire up a schedule/push trigger yourself if you want
# that tradeoff.
on:
  workflow_dispatch:
    inputs:
      distro:
        description: "Distro to build (see distros/)"
        default: ubuntu
        required: false
      os_version:
        description: "os_version to build from the distro's releases: list (default: first entry)"
        default: ""
        required: false
      layer:
        description: "Optional layer to build on top of a finished base image (see layers/)"
        default: ""
        required: false
      push:
        description: "Push the built artifact to the registry"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            qemu_packages: qemu-system-x86 ovmf
          - arch: arm64
            runner: ubuntu-24.04-arm
            qemu_packages: qemu-system-arm qemu-efi-aarch64

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Install QEMU + EFI firmware
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.qemu_packages }}

      - name: Enable KVM group perms
        # GitHub-hosted runners USUALLY have KVM-capable hardware but don't
        # ship /dev/kvm with permissions the runner user can use out of the
        # box -- this udev rule opens it up (0666) so the check below (and
        # QEMU itself) can use it instead of falling back to TCG. Best
        # effort, not fatal here: nested-virt support isn't guaranteed
        # uniform across GitHub's runner fleet, so some instances have no
        # /dev/kvm at all (a genuinely absent device, not a permissions
        # problem) -- the dedicated check below is the real pass/fail gate
        # and gives a clear error either way.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true

      - name: Check KVM availability
        # Informational only -- astroimg's own accel detection
        # (internal/platform.KVMUsable) falls back to TCG software
        # emulation automatically when /dev/kvm isn't usable, so this no
        # longer needs to fail the job. It's a real signal worth surfacing
        # though: TCG is much slower, so a run that used it will take
        # noticeably longer than usual.
        run: |
          if test -w /dev/kvm 2>/dev/null; then
            echo "KVM available"
          else
            echo "::warning::/dev/kvm not usable on this runner instance -- astroimg will fall back to TCG software emulation, which is much slower"
          fi

      - name: Set up oras
        uses: oras-project/setup-oras@v2

      - name: Build astroimg
        run: go build -o bin/astroimg ./cmd/astroimg

      - name: Run pipeline (headless)
        run: |
          ./bin/astroimg pipeline \
            --headless \
            --distro "${{ inputs.distro }}" \
            --os-version "${{ inputs.os_version }}" \
            --layer "${{ inputs.layer }}" \
            --arch "${{ matrix.arch }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: image-${{ inputs.distro }}${{ inputs.layer != '' && format('-{0}', inputs.layer) || '' }}-${{ matrix.arch }}
          path: build/*.qcow2
          retention-days: 7

      - name: Log in to registry
        if: ${{ inputs.push }}
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push artifact
        if: ${{ inputs.push }}
        run: |
          ./bin/astroimg push \
            --distro "${{ inputs.distro }}" \
            --os-version "${{ inputs.os_version }}" \
            --layer "${{ inputs.layer }}" \
            --arch "${{ matrix.arch }}" \
            --registry ghcr.io \
            --username "${{ github.repository_owner }}"
