name: Build golden image

# Manual trigger only: a full desktop-package install inside the guest takes
# 5-10+ minutes and consumes Actions minutes, so this deliberately doesn't
# run on every push. Wire up a schedule/push trigger yourself if you want
# that tradeoff.
#
# Workflow inputs are passed to `run:` scripts through env: rather than
# interpolated inline with ${{ }}, so a crafted input can't inject shell.
on:
  workflow_dispatch:
    inputs:
      distro:
        description: "Distro to build (see distros/)"
        default: ubuntu
        required: false
      os_version:
        description: "os_version to build from the distro's releases: list (default: first entry)"
        default: ""
        required: false
      layer:
        description: "Optional layer to build (see distros/<distro>/layers/). Its base is built first in the same job."
        default: ""
        required: false
      arch:
        description: "Architecture(s) to build"
        type: choice
        options: [all, amd64, arm64]
        default: all
      push:
        description: "Push the built artifact (the layer, if set, else the base) to the registry"
        type: boolean
        default: false
      push_base:
        description: "When building a layer, also push the base image it was built on"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Build arch matrix
        id: matrix
        env:
          ARCH: ${{ inputs.arch }}
        run: |
          set -euo pipefail
          MATRIX=$(jq -nc --arg want "$ARCH" '
            {include: [
              {arch: "amd64", runner: "ubuntu-latest"},
              {arch: "arm64", runner: "ubuntu-24.04-arm"}
            ] | map(select($want == "all" or .arch == $want))}')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "matrix: $MATRIX"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    # Hosted runners hard-stop at 360m; stay under it so a hung VM fails
    # with astroimg's own timeout error instead of a silent runner kill.
    timeout-minutes: 350
    env:
      DISTRO: ${{ inputs.distro }}
      OS_VERSION: ${{ inputs.os_version }}
      LAYER: ${{ inputs.layer }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up build host
        id: setup
        uses: ./.github/actions/setup-build
        with:
          arch: ${{ matrix.arch }}

      - name: Run base pipeline (headless)
        # A layer boots from build/<base>-<arch>.qcow2, which doesn't exist
        # on a fresh runner -- so a layer build always builds its base first.
        env:
          CLOUD_INIT_TIMEOUT: ${{ steps.setup.outputs.cloud_init_timeout }}
        run: |
          ./bin/astroimg pipeline \
            --headless \
            --distro "$DISTRO" \
            --os-version "$OS_VERSION" \
            --arch "$ARCH" \
            --cloud-init-timeout "$CLOUD_INIT_TIMEOUT"

      - name: Run layer pipeline (headless)
        if: ${{ inputs.layer != '' }}
        env:
          CLOUD_INIT_TIMEOUT: ${{ steps.setup.outputs.cloud_init_timeout }}
        run: |
          ./bin/astroimg pipeline \
            --headless \
            --distro "$DISTRO" \
            --os-version "$OS_VERSION" \
            --layer "$LAYER" \
            --arch "$ARCH" \
            --cloud-init-timeout "$CLOUD_INIT_TIMEOUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: image-${{ inputs.distro }}${{ inputs.layer != '' && format('-{0}', inputs.layer) || '' }}-${{ matrix.arch }}
          path: build/*.qcow2
          retention-days: 7

      - name: Log in to registry
        if: ${{ inputs.push }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: echo "$GH_TOKEN" | oras login ghcr.io -u "$GH_ACTOR" --password-stdin

      - name: Push base artifact
        if: ${{ inputs.push && (inputs.layer == '' || inputs.push_base) }}
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          ./bin/astroimg push \
            --distro "$DISTRO" \
            --os-version "$OS_VERSION" \
            --arch "$ARCH" \
            --registry ghcr.io \
            --username "$OWNER"

      - name: Push layer artifact
        if: ${{ inputs.push && inputs.layer != '' }}
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          ./bin/astroimg push \
            --distro "$DISTRO" \
            --os-version "$OS_VERSION" \
            --layer "$LAYER" \
            --arch "$ARCH" \
            --registry ghcr.io \
            --username "$OWNER"
